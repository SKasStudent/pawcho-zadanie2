name: Build i Push

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/weather-server
  CACHE_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/weather-cache

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU Setup
        uses: docker/setup-qemu-action@v3

      - name: Buildx Setup
        uses: docker/setup-buildx-action@v3

      - name: Dockerhub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: BuildCVE
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pogoda:scan
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:cache,mode=max

      - name: ScanCVE
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: pogoda:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:cache,mode=max
        
       
